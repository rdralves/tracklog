<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}TrackLog{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light">
    <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
            <nav class="d-flex justify-content-between align-items-center">
                <div>
                    <a href="{% url 'home' %}" class="text-white text-decoration-none me-3">Início</a>
                    <a href="{% url 'track_order' %}" class="text-white text-decoration-none">Rastrear Encomenda</a>
                </div>
                <h1 class="h4 m-0">TrackLog</h1>
            </nav>
        </div>
    </header>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
    <footer class="text-center text-muted py-4 mt-5">
        &copy; {{ year|default:"2024" }} TrackLog - Sistema de Rastreamento Logístico
    </footer>
    <!-- Bootstrap JS (opcional, para componentes interativos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
